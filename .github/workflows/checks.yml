name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
        shell: bash
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: contract_test
          POSTGRES_PASSWORD: contract_test
          POSTGRES_DB: feeding_brennen_contract_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contract_test -d feeding_brennen_contract_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://contract_test:contract_test@127.0.0.1:5432/feeding_brennen_contract_test
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3000
      TEST_API_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: '1'
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Apply migrations twice
        run: |
          npm run migrate
          npm run migrate
      - name: Core checks across timezones
        run: |
          for timezone in UTC America/Los_Angeles Asia/Tokyo Pacific/Kiritimati; do
            echo "Testing timezone: $timezone"
            TZ="$timezone" npm test
          done
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Production HTTP contract
        env:
          TZ: Asia/Tokyo
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/contract-server.log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=false
          for attempt in {1..60}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Production server exited before becoming ready"
              exit 1
            fi
            if curl --fail --silent --max-time 2 "$TEST_API_URL/api/health" > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "Production server did not become ready within the bounded wait"
            exit 1
          fi
          npm run test:api
